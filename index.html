</style></head><body>

<script>

const CH=[{n:'Hutan Bambu',c:'#3f8f46'},{n:'Goa Bebatuan',c:'#5a5a86'},{n:'Pantai',c:'#d9962a'}],DF=['Mudah','Sedang','Sulit'];

[["Siapa proklamator kemerdekaan Indonesia bersama Moh. Hatta?","Soekarno","Soeharto","Sudirman","Diponegoro"],["Hari Kemerdekaan Indonesia diperingati setiap tanggal …","17 Agustus","1 Juni","28 Oktober","10 November"],["Lambang negara Indonesia adalah …","Garuda Pancasila","Elang Jawa","Banteng","Harimau"]],
[["Bunyi sila pertama Pancasila adalah …","Ketuhanan Yang Maha Esa","Persatuan Indonesia","Keadilan sosial","Kemanusiaan yang adil dan beradab"],["Sumpah Pemuda diikrarkan pada tahun …","1928","1945","1908","1966"],["Siapa pencipta lagu Indonesia Raya?","W.R. Supratman","Ismail Marzuki","C. Simanjuntak","Ibu Sud"]],
[["Semboyan Bhinneka Tunggal Ika terdapat dalam kitab …","Sutasoma","Negarakertagama","Pararaton","Arjunawiwaha"],["Raja Majapahit pada masa puncak kejayaan adalah …","Hayam Wuruk","Airlangga","Purnawarman","Sri Jayanasa"],["UUD 1945 disahkan oleh badan bernama …","PPKI","BPUPKI","DPR","MPR"]]],[
[["Hewan langka khas Pulau Komodo adalah …","Komodo","Badak","Orangutan","Anoa"],["Gunung tertinggi di Indonesia adalah …","Puncak Jaya","Semeru","Rinjani","Kerinci"],["Danau Toba berada di provinsi …","Sumatera Utara","Jawa Barat","Bali","Sulawesi Selatan"]],
[["Gunung Krakatau terletak di selat …","Sunda","Malaka","Makassar","Lombok"],["Sungai terpanjang di Indonesia adalah …","Kapuas","Musi","Bengawan Solo","Mahakam"],["Burung cenderawasih berasal dari …","Papua","Sumatera","Jawa","Bali"]],
[["Garis khatulistiwa melintasi kota …","Pontianak","Surabaya","Makassar","Palembang"],["Garis Wallace memisahkan fauna Asia dan …","Australia","Afrika","Amerika","Eropa"],["Gunung Tambora yang meletus tahun 1815 berada di pulau …","Sumbawa","Lombok","Flores","Jawa"]]],[
[["Alat musik bambu dari Jawa Barat adalah …","Angklung","Gamelan","Sasando","Tifa"],["Rumah adat Minangkabau disebut …","Rumah Gadang","Joglo","Tongkonan","Honai"],["Tari Kecak terkenal berasal dari …","Bali","Aceh","Papua","Kalimantan"]],
[["Wayang kulit paling terkenal berasal dari …","Jawa","Sumatera","Maluku","Papua"],["Rumah adat Toraja disebut …","Tongkonan","Gadang","Honai","Panjang"],["UNESCO mengakui batik sebagai warisan budaya pada tahun …","2009","1999","2015","1985"]],
[["Tradisi lompat batu di Nias disebut …","Fahombo","Pasola","Karapan Sapi","Debus"],["Tradisi Pasola berasal dari pulau …","Sumba","Bali","Madura","Nias"],["Aksara tradisional Jawa disebut …","Hanacaraka","Lontara","Rejang","Pallawa"]]]];
const sv=(c,l)=>save[c+'-'+l]||0,star=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const unl=(c,l)=>l>0?sv(c,l-1)>0:c>0?sv(c-1,2)>0:true;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),CT={x:180,y:270},DR={x:180,y:200};
let mode='menu',G=null,T=0;
function ui(h,d=1,t=0){const s=$('#scr');s.innerHTML=h;s.className=(d?'dim ':'')+(t?'top':'');s.style.display=h?'flex':'none'}
function home(){G=null;mode='menu';$('#hud').style.display=$('#joy').style.display='none'}
function howto(){ui(`<div class=box><h2>Cara Bermain</h2><p>1. Gerakkan Andi dengan joystick (atau tombol panah / WASD di laptop).</p><p>2. Dekati batu bercahaya, selesaikan minigame 2D untuk bonus 50:50, lalu jawab pertanyaan dan kumpulkan kepingan sandi.</p><p>3. Buka peti kayu dengan 3 digit sandi sesuai urutan batu.</p><p>4. Ambil sandi di peti, kalahkan boss penjaga dengan tombol ⚔ (atau spasi), lalu masuk ke rumah adat.</p><p>Jawaban salah mengurangi nyawa ❤. Makin sedikit salah, makin banyak bintang.</p><button class=btn onclick=menu()>Mengerti</button></div>`)}
function chapters(){home();let h='<h2 class=hd>Pilih Chapter</h2>';CH.forEach((c,i)=>{const ok=unl(i,0),t=[0,1,2].reduce((a,l)=>a+sv(i,l),0);h+=`<button class="card${ok?'':' lk'}" style="--c:${c.c}" ${ok?`onclick="levels(${i})"`:''}><b>Chapter ${i+1}</b><span>${c.n}</span><i>${ok?'★ '+t+'/9':'🔒'}</i></button>`});ui(h+'<button class="btn s" onclick=menu()>Kembali</button>')}
function levels(c){home();let h=`<h2 class=hd>${CH[c].n}</h2><p class=sm>Chapter ${c+1}</p>`;DF.forEach((d,l)=>{const ok=unl(c,l);h+=`<button class="card${ok?'':' lk'}" style="--c:${CH[c].c}" ${ok?`onclick="start(${c},${l})"`:''}><b>Level ${l+1}</b><span>${d}</span><i>${ok?star(sv(c,l)):'🔒'}</i></button>`});ui(h+'<button class="btn s" onclick=chapters()>Kembali</button>')}
function start(c,l){const pool=[[60,310],[300,300],[180,390],[75,450],[290,460],[180,520],[60,545],[300,550]].sort(()=>Math.random()-.5);
G={c,l,p:{x:180,y:595,f:1,ph:0},st:pool.slice(0,3).map(p=>({x:p[0],y:p[1],done:0})),dg:[0,0,0].map(()=>Math.floor(Math.random()*10)),H:l==2?2:3,err:0,chest:0,door:0,cd:1,ent:'',qs:Q[c][l],fight:0,bh:3,pr:[],bp:[],ac:0,inv:0,bs:{x:180,hp:6+l*3,m:6+l*3}};
mode='play';ui('');$('#hud').style.display='block';$('#joy').style.display='block';hud();toast(`Chapter ${c+1} · Level ${l+1} (${DF[l]}) — dekati batu bercahaya!`)}
function hud(){setTimeout(hudB,0);$('#ttl').textContent=`Ch.${G.c+1} · ${DF[G.l]}`;$('#hr').textContent='❤'.repeat(G.H-G.err)+'🖤'.repeat(G.err);$('#code').innerHTML=G.st.map((s,i)=>`<span class="dg${s.done?' on':''}">${s.done?G.dg[i]:'?'}</span>`).join('')}
function toast(m){const t=$('#ts');t.textContent=m;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,3000)}
function pause(){if(mode!='play')return;mode='pause';ui(`<h2 class=hd>Jeda</h2><button class=btn onclick=cm()>Lanjutkan</button><button class="btn s" onclick=start(${G.c},${G.l})>Ulangi</button><button class="btn s" onclick=levels(${G.c})>Pilih Level</button><button class="btn s" onclick=menu()>Menu Utama</button>`)}
function cm(){ui('');mode='play';G.cd=1.5;hud();if(G.fight&&!G.bt){G.bt=1;toast('BOSS: '+BN[G.c]+'! Geser Andi, tekan ⚔ untuk menyerang')}}
function hit(){G.err++;hud();if(G.err>=G.H){mode='lose';beep(120,.5,'sawtooth');ui(`<div class=box><h2>Andi kehabisan semangat…</h2><p>Jangan menyerah, pelajari lagi dan coba kembali!</p><button class=btn onclick=start(${G.c},${G.l})>Coba Lagi</button><button class="btn s" onclick=levels(${G.c})>Pilih Level</button></div>`);return 1}}
function ask2(i,h){mode='q';const q=G.qs[i],o=q.slice(1).map((t,k)=>({t,c:!k})).sort(()=>Math.random()-.5);if(h)o.splice(o.findIndex(a=>!a.c),1);G.q={i,o};
ui(`<div class=box><div class=tag>Batu Sandi ${i+1} dari 3${h?' · Bonus 50:50':''}</div><h2>${q[0]}</h2><div class=opts>${o.map((a,k)=>`<button onclick="ans(${k},this)">${a.t}</button>`).join('')}</div></div>`)}
function ans(k,b){if(b.disabled)return;const o=G.q.o[k];
if(o.c){const i=G.q.i;G.st[i].done=1;hud();burst(G.st[i].x,G.st[i].y-30,34,['#ffd54a','#fff3b0','#8fd16a'],120);beep(784,.15);setTimeout(()=>beep(988,.2),130);const all=G.st.every(s=>s.done);
ui(`<div class=box><h2>✔ Benar!</h2><p>Kepingan sandi ke-${i+1}:</p><div class=big>${G.dg[i]}</div><p>${all?'Semua kepingan terkumpul! Pergi ke peti kayu di depan rumah.':'Cari batu sandi berikutnya.'}</p><button class=btn onclick=cm()>Lanjut</button></div>`)}
else{b.disabled=true;b.className='no';SH=10;beep(160,.25,'square');hit()}}
function keypad(){mode='k';G.ent='';kp()}
function kp(m){let b='';for(let i=1;i<=9;i++)b+=`<button onclick=kd(${i})>${i}</button>`;
ui(`<div class="box ${m?'shk':''}"><h2>Peti Kayu Terkunci</h2><p>Masukkan 3 kepingan sandi sesuai urutan batu</p><div class=sls>${[0,1,2].map(i=>`<span class=dg>${G.ent[i]||'_'}</span>`).join('')}</div><div class=kp>${b}<button onclick=kback()>⌫</button><button onclick=kd(0)>0</button><button onclick=kclose()>✕</button></div></div>`)}
function kd(n){if(G.ent.length>=3)return;G.ent+=n;beep(500+n*40,.06);kp();if(G.ent.length==3)setTimeout(chk,250)}
function kback(){G.ent=G.ent.slice(0,-1);kp()}
function kclose(){cm();G.cd=2.5}
function chk(){if(mode!='k')return;
if(G.ent==G.dg.join('')){G.chest=1;G.door=0;G.fight=1;mode='q';burst(CT.x,CT.y-30,70,['#ffd54a','#fff3b0','#ffb347'],150);beep(660,.15);setTimeout(()=>beep(880,.15),150);setTimeout(()=>beep(1175,.3),300);
ui(`<div class=box><h2>Peti Terbuka!</h2><p>Di dalam peti ada gulungan sandi:</p><div class=word>${WD[G.c][G.l]}</div><p>Sandi diucapkan… tapi penjaga rumah adat muncul! Kalahkan dia untuk masuk.</p><button class=btn onclick=cm()>Lanjut</button></div>`)}
else{beep(150,.3,'square');G.ent='';if(G.l>0&&hit())return;kp(1)}}
function win(){mode='win';conf();const s=G.err==0?3:G.err==1?2:1,k=G.c+'-'+G.l;if((save[k]||0)<s){save[k]=s;persist()}
beep(523,.15);setTimeout(()=>beep(659,.15),150);setTimeout(()=>beep(784,.35),300);
const nx=G.l<2?[G.c,G.l+1]:G.c<2?[G.c+1,0]:null;
ui(`<div class=box><h2>Sandi Terpecahkan!</h2><div class=big>${star(s)}</div><p>Sandi: <b>${WD[G.c][G.l]}</b></p><p>Andi masuk ke rumah adat dengan selamat.</p>${nx?`<button class=btn onclick="start(${nx})">Berikutnya ▶</button>`:'<p><b>Tamat! Kamu Pahlawan Nusantara!</b></p>'}<button class="btn s" onclick=start(${G.c},${G.l})>Ulangi</button><button class="btn s" onclick=levels(${G.c})>Pilih Level</button></div>`)}
const J={x:0,y:0},K={},jy=$('#joy'),kn=$('#kn');
function jm(e){const r=jy.getBoundingClientRect(),R=r.width/2;let dx=e.clientX-r.left-R,dy=e.clientY-r.top-R;const d=Math.hypot(dx,dy),L=R*.6;if(d>L){dx*=L/d;dy*=L/d}J.x=dx/L;J.y=dy/L;kn.style.transform=`translate(${dx}px,${dy}px)`}

jy.onpointermove=e=>{if(e.buttons||e.pointerType=='touch')jm(e)};

addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key==' '){e.preventDefault();atk()}if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{delete K[e.key.toLowerCase()]});
function upd(dt){const p=G.p;let ix=(K.arrowright||K.d?1:0)-(K.arrowleft||K.a?1:0)+J.x,iy=(K.arrowdown||K.s?1:0)-(K.arrowup||K.w?1:0)+J.y;
const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}
p.x=Math.min(335,Math.max(25,p.x+ix*130*dt));p.y=Math.min(605,Math.max(G.fight?300:195,p.y+iy*130*dt));
